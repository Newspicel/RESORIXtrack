<!doctype html>
<html lang="{{ locale }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#eef2f6;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#1c1c1f">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef2f6;padding:32px 12px">
<tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(20,37,77,.08)">
<tr><td style="height:6px;background:linear-gradient(135deg,#61cae2 0%,#35a1cc 45%,#14254d 100%);background-color:#35a1cc"></td></tr>
<tr><td style="padding:28px 32px 8px">{% if has_logo %}<img src="cid:logo" alt="{{ company }}" width="180" style="display:block;border:0;height:auto">{% else %}<span style="font-size:18px;font-weight:700;color:#14254d">{{ company }}</span>{% endif %}</td></tr>
<tr><td style="padding:8px 32px 0"><h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;color:#14254d">{{ subject }}</h1></td></tr>
<tr><td style="padding:0 32px;font-size:15px;line-height:1.6;color:#2a2b2e">
{% for p in paragraphs %}<p style="margin:0 0 14px">{{ p | replace("\n", "<br>"|safe) }}</p>{% endfor %}
</td></tr>
{% if cta_url %}
<tr><td style="padding:8px 32px 24px">
<a href="{{ cta_url }}" style="display:inline-block;background:#35a1cc;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:8px">{{ cta_label }}</a>
<p style="margin:16px 0 0;font-size:12px;color:#62656b;word-break:break-all">{{ cta_url }}</p>
</td></tr>
{% endif %}
<tr><td style="padding:16px 32px 28px;border-top:1px solid #eef2f6;font-size:12px;color:#8a8d93">RESORIXtrack · {{ company }}</td></tr>
</table>
</td></tr></table>
</body></html>

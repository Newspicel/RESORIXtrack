[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resorixtrack"
version = "1.0.0"
description = "RESORIXtrack: self-hosted time tracking by RESORIX AG"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "flask>=3.1,<4",
  "flask-sqlalchemy>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "flask-migrate>=4.0,<5",
  "flask-smorest>=0.45,<1",
  "marshmallow>=3.22,<5",
  "argon2-cffi>=23.1",
  "holidays>=0.60",
  "openpyxl>=3.1,<4",
  "weasyprint>=70",
  "gunicorn>=23",
  "pyotp>=2.9",
  "segno>=1.6",
  "cryptography>=44",
]

[project.urls]
Homepage = "https://github.com/RESORIX-AG/RESORIXtrack"
Repository = "https://github.com/RESORIX-AG/RESORIXtrack"
Changelog = "https://github.com/RESORIX-AG/RESORIXtrack/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["resorixtrack*"]

[tool.setuptools.package-data]
resorixtrack = ["templates/**/*", "migrations/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:flask_smorest.*", "ignore::DeprecationWarning:apispec.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"resorixtrack/migrations/**" = ["I", "UP", "W"]
"resorixtrack/config.py" = ["S105"]
"resorixtrack/db_guards.py" = ["S608"]  # static trigger DDL built from constants

[tool.coverage.run]
source = ["resorixtrack"]
omit = ["resorixtrack/migrations/*"]

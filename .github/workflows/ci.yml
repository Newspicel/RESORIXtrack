name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with: { node-version: "26", cache: pnpm }
      - name: Install (python3, make and g++ for better-sqlite3's node-gyp step are on the runner)
        run: pnpm install --frozen-lockfile
      - name: Lint, types, translations, licenses
        run: |
          pnpm lint
          pnpm typecheck
          pnpm i18n:check
          pnpm exec tsx scripts/licenses.ts --check
      - name: Unit tests
        run: pnpm test
      - name: Chromium with system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t resorixtrack:latest -f docker/Dockerfile .
      - name: Smoke test
        run: scripts/smoke.sh

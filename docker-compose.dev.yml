# Local development helpers: Mailpit catches all emails (UI: http://localhost:8025).
# Bound to localhost only: Mailpit shows password-reset links in clear text.
name: resorixtrack-dev
services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    restart: unless-stopped
